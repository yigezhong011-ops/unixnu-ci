            if(!error){struct fchown_args own={.fd=fd,.uid=501,.gid=501};error=fchown(p,&own,&result);}
            if(!error){struct fchmod_args cm={.fd=fd,.mode=0600};error=fchmod(p,&cm,&result);}
            struct close_args cl={.fd=fd};int ce=sys_close(p,&cl,&result);if(!error)error=ce;
            if(!error)++files;
           }
