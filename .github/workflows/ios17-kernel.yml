           // the error lines were 70% of the USB log and kept the transmitter full (control replies dropped). Root-owned, 0755.
           static const char *const sheng_log_dirs[]={"/private/var/log","/private/var/log/com.apple.xpc.launchd"};
           for(unsigned i=0;!error && i<sizeof(sheng_log_dirs)/sizeof(sheng_log_dirs[0]);++i) {
            error=copyout(sheng_log_dirs[i],scratch,strlen(sheng_log_dirs[i])+1);
            if(error)break;
            struct mkdir_args md={.path=scratch,.mode=0755};
            error=mkdir(p,&md,&result);
            if(error==EEXIST){error=0;continue;}
            if(!error)++dirs;
           }
           for(unsigned i=0;!error && i<sizeof(sheng_skip_dirs)/sizeof(sheng_skip_dirs[0]);++i) {
            error=copyout(sheng_skip_dirs[i],scratch,strlen(sheng_skip_dirs[i])+1);
            if(error)break;
            struct mkdir_args md={.path=scratch,.mode=0755};
            error=mkdir(p,&md,&result);
            if(error==EEXIST){error=0;continue;}
            if(!error){++dirs;struct lchown_args own={.path=scratch,.owner=501,.group=501};error=lchown(p,&own,&result);}
           }
           for(unsigned i=0;!error && i<sizeof(sheng_skip_files)/sizeof(sheng_skip_files[0]);++i) {
            const char *path=sheng_skip_files[i][0],*body=sheng_skip_files[i][1];
            error=copyout(path,scratch,strlen(path)+1);
            if(error)break;
            struct open_args op={.path=scratch,.flags=O_WRONLY|O_CREAT|O_NOFOLLOW|(on==2?O_TRUNC:O_EXCL),.mode=0600};
            error=open(p,&op,&result);
            if(error==EEXIST){error=0;++existing;continue;}
            if(error)break;
            int fd=result;size_t total=strlen(body);
            for(size_t sent=0;!error && sent<total;) {
             size_t piece=total-sent<0x1f0?total-sent:0x1f0;
             error=copyout(body+sent,scratch+0x200,piece);
             if(!error){struct write_args wr={.fd=fd,.cbuf=scratch+0x200,.nbyte=piece};user_ssize_t written=0;error=write(p,&wr,&written);
              if(!error && written!=(user_ssize_t)piece)error=EIO;}
             sent+=piece;
