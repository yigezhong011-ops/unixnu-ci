      - name: encrypt and upload
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/up"
          command -v age >/dev/null || { echo "age not installed (tools step did not run): nothing to upload"; exit 0; }
          K=$(find UniXNU/out-ios17 -path '*/kernel/kernel.macho' | head -1)
          if [ -n "$K" ]; then
            tar -C "$(dirname "$K")" -czf "$RUNNER_TEMP/k.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/ios17-kernel.tgz.age" "$RUNNER_TEMP/k.tgz"; rm -f "$RUNNER_TEMP/k.tgz"
          fi
          if [ -d "$RUNNER_TEMP/addon-out" ]; then
            tar -C "$RUNNER_TEMP/addon-out" -czf "$RUNNER_TEMP/a.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/ios17-gpuaddon.tgz.age" "$RUNNER_TEMP/a.tgz"; rm -rf "$RUNNER_TEMP/a.tgz" "$RUNNER_TEMP/addon-out"
          fi
          # Build logs only (no binaries): find *.log under out-ios17, encrypted too since they may quote kernel symbols.
          find UniXNU/out-ios17 -name '*.log' -size -20M 2>/dev/null | tar -czf "$RUNNER_TEMP/logs.tgz" -T - 2>/dev/null || true
          [ -s "$RUNNER_TEMP/logs.tgz" ] && age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/logs.tgz.age" "$RUNNER_TEMP/logs.tgz"
          ls -la "$RUNNER_TEMP/up"
          rm -rf UniXNU/out-ios17/ipsw "$RUNNER_TEMP/kc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unixnu-fuxi-ios17-kernel
          path: ${{ runner.temp }}/up
          if-no-files-found: warn
