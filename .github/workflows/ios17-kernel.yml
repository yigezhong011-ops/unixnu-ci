              sys.exit(0)
          # 1) 在 pm4 编译之后插入 fuxi air 的编译
          pm4_anchor = "pm4 = OUT / 'AdrenoPM4.o'"
          if pm4_anchor not in t:
              print(p + ': pm4 anchor not found', file=sys.stderr)
              sys.exit(0)
          i = t.index(pm4_anchor)
          j = t.index('\n', i) + 1
          compile_line = (
              "# 1) 组装 shaders/scanout_convert.ll -> .bc（FuxiScanoutScaleAir.c 用 .incbin 嵌入它）\n"
              "scanout_ll = ROOT / 'drivers/AdrenoMetal/shaders/scanout_convert.ll'\n"
              "scanout_bc = OUT / 'scanout_convert.bc'\n"
              "if scanout_ll.is_file():\n"
              "    subprocess.run(['xcrun', 'llvm-as', str(scanout_ll), '-o', str(scanout_bc)], check=True)\n"
              "else:\n"
              "    raise SystemExit('missing ' + str(scanout_ll))\n"
              "# 2) 编译 FuxiScanoutScaleAir.c，把 .bc 的绝对路径作为 FUXI_SCANOUT_AIR 传给 .incbin\n"
              "fuxi_air = OUT / 'FuxiScanoutScaleAir.o'\n"
              "subprocess.run([*base, '-std=c11', '-DFUXI_SCANOUT_AIR=' + str(scanout_bc.resolve()),\n"
              "                '-c', ROOT / 'drivers/AdrenoMetal/bridge/FuxiScanoutScaleAir.c', '-o', fuxi_air], check=True)\n")
          t = t[:j] + compile_line + t[j:]
          # 2) 在链接命令里 pm4 之后加 fuxi_air
          if 'pm4, BRIDGE' in t:
              t = t.replace('pm4, BRIDGE', 'pm4, fuxi_air, BRIDGE', 1)
          elif "'-x', 'none', pm4," in t:
              t = t.replace("'-x', 'none', pm4,", "'-x', 'none', pm4, fuxi_air,", 1)
          else:
              print(p + ': link-command anchor not found', file=sys.stderr)
              sys.exit(0)
          open(p, 'w').write(t)
          print(p + ': FuxiScanoutScaleAir.c wired in')
          PY
          done
          exit 0

      - name: tolerate fuxi watchdog shadow warnings
        run: |
          # kerfand_ref 82e4615 的 kits/sheng/BootWatchdogPolicy.c 用了 size_t total，
          # 遮蔽 bsd/sys/vmmeter.h 的 extern struct vmtotal total；archive-22 用
          # -Wall -Wextra -Werror 编它，于是 10 个 shadow 全变成错误。补 -Wno-shadow。
          set +e
          n=0
          for f in $(find device device-ios17 -name 'build-ios17-legacy-display.py' -type f 2>/dev/null); do
            python3 - "$f" <<'PY' || true
          import sys
          p = sys.argv[1]
          try:
              t = open(p).read()
          except OSError:
              sys.exit(0)
          if '-Wno-shadow' in t:
              print(p + ': already has -Wno-shadow')
              sys.exit(0)
          old = "['-mgeneral-regs-only', '-Wall', '-Wextra', '-Werror']"
          new = "['-mgeneral-regs-only', '-Wall', '-Wextra', '-Wno-shadow']"
          if old not in t:
              print(p + ': compile-flag anchor not found', file=sys.stderr)
              sys.exit(0)
          open(p, 'w').write(t.replace(old, new, 1))
          print(p + ': -Wno-shadow added')
          PY
            n=$((n+1))
          done
          echo "patched $n build script(s)"
          exit 0

      - name: uefi-fuxi (pinned fuxi.dtb, read only)
        run: |
          # prepare-fuxi-gmu.py and friends read ../uefi-fuxi/Resources/DTBs/fuxi.dtb (pinned sha 0590a46c...).
          git clone -q --filter=blob:none https://github.com/ljhhkx529/uefi-fuxi.git uefi-fuxi
          git -C uefi-fuxi checkout -q 57969ab77d36a982261daef16592741ed4a1d811
          shasum -a 256 uefi-fuxi/Resources/DTBs/fuxi.dtb
          echo "FUXI_DTB=$GITHUB_WORKSPACE/uefi-fuxi/Resources/DTBs/fuxi.dtb" >> "$GITHUB_ENV"

      - name: VerifiedRoot inputs (header-only)
        env:
          VROOT_INPUTS: ${{ secrets.VROOT_INPUTS }}
        run: |
          # The two signed root policies and the trusted public key of the flashed 21H16 root (taken from the boot (2).img
          # kernel), from a secret. The block-hash tables stay in userdata ("<window>.hashes"); the build only needs the
          # headers, so build-ios17-verified-root.py is switched to header-only inputs and zero self-test samples.
          V="$RUNNER_TEMP/vroot"; mkdir -p "$V"; printf '%s' "$VROOT_INPUTS" | base64 -d | tar -xzf - -C "$V"; ls -la "$V"/os
          echo "VERIFIED_ROOT_DIR=$V" >> "$GITHUB_ENV"
          python3 - device-ios17/scripts/build-ios17-verified-root.py <<'PY'
          import re, sys
          p = sys.argv[1]; t = open(p).read()
          a = t.index("    manifest = (policy / 'manifest.bin').read_bytes()")
          b = t.index("the signed header does not carry the table digest')") + len("the signed header does not carry the table digest')")
          t = t[:a] + "    image_bytes = struct.unpack_from('<Q', header, 24)[0]; block_count = (image_bytes + 4095) // 4096" + t[b:]
          t = t.replace("table_bytes=len(manifest) - 544, table_sha256=hashlib.sha256(manifest[544:]).hexdigest(),",
                        "table_bytes=block_count * 32, table_sha256='',")
          a = t.index("report = json.loads(IMAGE.with_name('userdata-root.json').read_text())")
          b = t.index("samples.write_bytes(data)") + len("samples.write_bytes(data)")
          t = t[:a] + ("count = records[0]['block_count']\nindices = [0, 1, count // 2, count - 1]\n"
                       "lengths = [4096, 4096, 4096, records[0]['image_bytes'] - (count - 1) * 4096]\n"
                       "samples = out / 'original-samples.bin'\nsamples.write_bytes(bytes(4 * 4096))") + t[b:]
          open(p, 'w').write(t); print('header-only patch applied')
          print(t[t.index('records, key = [], None'):t.index('os_head, sys_head')])
          PY

      - name: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          brew install vulkan-headers vulkan-loader dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup age unifdef
          # Intel runners: Homebrew is /usr/local; Kerfand's scripts use /opt/homebrew/opt/<formula>.
          if [ "$(brew --prefix)" != /opt/homebrew ] && [ ! -e /opt/homebrew/opt ]; then
            sudo mkdir -p /opt/homebrew; sudo ln -s "$(brew --prefix)/opt" /opt/homebrew/opt; ls -la /opt/homebrew; fi
          brew install blacktop/tap/ipsw || true
          if ! command -v ipsw >/dev/null; then
            # ipsw cask did not load (Intel image): take the macOS build from blacktop/ipsw's latest release.
            A=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/blacktop/ipsw/releases/latest |
                python3 -c 'import json,sys,platform; a=[x["browser_download_url"] for x in json.load(sys.stdin)["assets"]]; m="x86_64" if platform.machine()=="x86_64" else "arm64"; c=[u for u in a if u.rsplit("/",1)[-1].startswith("ipsw_") and "macOS" in u and u.endswith(".tar.gz") and "frida" not in u and ("universal" in u or m in u)]; print(c[0])')
            echo "ipsw from $A"; mkdir -p "$RUNNER_TEMP/ipsw"; curl -fsSL "$A" | tar xz -C "$RUNNER_TEMP/ipsw"
            sudo install -m 0755 "$(find "$RUNNER_TEMP/ipsw" -name ipsw -type f | head -1)" /usr/local/bin/ipsw; fi
          ipsw version
          {
            echo "$HOME/.cargo/bin"; echo "/opt/homebrew/opt/llvm/bin"; echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"; echo "$(brew --prefix unifdef)/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          rustup target add aarch64-apple-ios --toolchain 1.98.0
          xcrun --sdk iphoneos --show-sdk-version

      - name: kernelcache 21H16
        run: |
          D="$GITHUB_WORKSPACE/UniXNU/out-ios17/ipsw/21H16"; mkdir -p "$D" "$RUNNER_TEMP/kc"
          ipsw extract --kernel --remote "$IPSW_URL" -o "$RUNNER_TEMP/kc"
          RAW=$(find "$RUNNER_TEMP/kc" -iname 'kernelcache.release.iphone15*' -type f | head -1)
          echo "kernelcache: $RAW"; test -n "$RAW"
          ipsw kernel dec "$RAW" -o "$RUNNER_TEMP/kc" || true
          DEC=$(find "$RUNNER_TEMP/kc" -name '*.decompressed' -type f | head -1)
          if [ -z "$DEC" ] && [ "$(head -c 4 "$RAW" | xxd -p)" = "cffaedfe" ]; then DEC=$RAW; fi
          test -n "$DEC"; cp "$DEC" "$D/kernelcache.decompressed"; ls -la "$D"

      - name: tree only (no kernel)
        if: ${{ !inputs.build_kernel }}
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_XNU_ARCH: arm64e
        run: |
          export UNIXNU_OUT="$PWD/out-ios17" UNIXNU_KERNELCACHE="$PWD/out-ios17/ipsw/21H16/kernelcache.decompressed"
          [ -f ../device/scripts/extract-files.py ] && python3 ../device/scripts/extract-files.py --device ../device || echo "extract-files skipped/failed"
          ./unixnu defconfig fuxi_ios17_kernel_defconfig -D ../device-ios17
          ./unixnu tree -D ../device-ios17
          ls out-ios17/fuxi/tree/scripts | grep -E 'turnip|metal-plugin|statusbar|gpu-addon|owner-trust'

      - name: kernel
        if: ${{ inputs.build_kernel }}
        working-directory: UniXNU
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_XNU_ARCH: arm64e
          UNIXNU_FILESET_KERNEL_FIRST: 1
          XNU_KERNEL_CHAINED_FIXUPS: 1
          JOBS: 4
        run: |
          export UNIXNU_OUT="$PWD/out-ios17" UNIXNU_KERNELCACHE="$PWD/out-ios17/ipsw/21H16/kernelcache.decompressed"
          [ -f ../device/scripts/extract-files.py ] && python3 ../device/scripts/extract-files.py --device ../device || echo "extract-files skipped/failed"
          ./unixnu defconfig fuxi_ios17_kernel_defconfig -D ../device-ios17
          T="$PWD/out-ios17/fuxi/tree"
          REF="$T/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf"
          # The prelink step matches against a symbol-bearing RELEASE (LTO) comparison kernel built from the same xnu
          # tree (Kerfand builds it once and reuses it). First pass: assemble the tree and build everything up to the
          # prelink, which fails without the reference; then build the reference, then the kernel again.
          if ! ./unixnu build kernel -D ../device-ios17 -j 4; then
            test -d "$T/.cache/xnu-work"
            echo "=== RELEASE LTO reference"
            # The stub pass only picks undefined names that start with "_"; ld prints C++ names demangled
            # (run 11: "OSValueObject<int>::MetaClass::MetaClass()"). Map those back to their mangled names
            # through the undefined symbols of the linked objects (nm -u + c++filt).
            python3 - "$T/scripts/build-fileset-release-reference.py" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          old = "    if stub_names:\n"
          new = '''    demangled = sorted(set(re.findall(r'^\\s+"([^_"][^"]*)", referenced from', blocks[-1], re.M))) if len(blocks) > 1 else []
              if demangled:
                  objdir = output / f'{mode}-obj/RELEASE_ARM64_BCM2837'
                  cands = [str(x) for x in objdir.rglob('*.o')] + [str(x) for x in objdir.rglob('*.a')]
                  mangled = set()
                  for i in range(0, len(cands), 200):
                      r = subprocess.run(['xcrun', 'nm', '-uj', *cands[i:i + 200]], capture_output=True, text=True)
                      mangled.update(l.strip() for l in r.stdout.splitlines() if l.strip().startswith('__Z'))
                  mangled = sorted(mangled)
                  plain = subprocess.run(['xcrun', 'c++filt', '-_'], input='\\n'.join(mangled), capture_output=True, text=True).stdout.splitlines()
                  want = set(demangled)
                  extra = [m for m, d in zip(mangled, plain) if d.strip() in want]
                  if 'OSValueObject<int>::MetaClass::MetaClass()' in want: extra.append('__ZN13OSValueObjectIiE9MetaClassC1Ev')
                  # A constructor/destructor named once may be referenced as C1 or C2 (D1/D2): stub both.
                  for m in list(extra):
                      for a, b in (('C1E', 'C2E'), ('C2E', 'C1E'), ('D1E', 'D2E'), ('D2E', 'D1E')):
                          if a in m: extra.append(m.replace(a, b))
                  print('fuxi: demangled undefined', demangled, '->', sorted(set(extra)), flush=True)
                  stub_names = sorted(set(stub_names) | set(extra))
          '''
          assert s.count(old) == 1, 'stub anchor'
          s = s.replace(old, new + old, 1)
          open(p, 'w').write(s)
          print('patched demangled stubs')
          PY
            python3 -m py_compile "$T/scripts/build-fileset-release-reference.py"
            ( cd "$T" && python3 scripts/build-fileset-release-reference.py --tree "$T" --lto ) || {
              tail -60 $(ls -t "$T"/build/xnu/fileset-reference/*/lto-build.log | head -1); exit 1; }
            ls -la "$REF"
            cp "$REF" "$RUNNER_TEMP/reference.noctf"
            ./unixnu build kernel -D ../device-ios17 -j 4 || {
              # The tree may have been reassembled without the reference: put it back once more and retry.
              mkdir -p "$(dirname "$REF")"; cp "$RUNNER_TEMP/reference.noctf" "$REF"
              ./unixnu build kernel -D ../device-ios17 -j 4; }
          fi
          find out-ios17 -name kernel.macho -print

      - name: Prepare Mesa, the translator and the Mesa venv
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out-ios17/fuxi/tree
          command -v glslangValidator >/dev/null || brew install glslang
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          ROOT = Path('.').resolve()
          def run(*c): subprocess.run([str(x) for x in c], check=True)
          import os, re, urllib.request
          def main_file(path):
              req = urllib.request.Request('https://api.github.com/repos/SadNutWall/UniXNU/contents/' + path,
                                           headers={'Accept': 'application/vnd.github.raw', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              return urllib.request.urlopen(req).read().decode()
          # translator 字段就是 metal2vulkan 的 commit：PATCHES 那 4 个 .rs 补丁必须和它配套。
          # 只从 main 同步其中一样（或两样都不同步但树里的 PATCHES 已过期）都会让补丁打不上：
          #   patch does not apply: const_loads.rs:9 / mod.rs:508 / tests.rs:1678 / engine_arena.rs:1367
          # 所以两样一起从 main 同步（源码版本随之被 checkout 按新 translator 拉取）。
          inputs = ROOT / 'scripts/data/gpu-metal-vulkan-inputs.json'
          if inputs.is_file():
              cur = json.loads(inputs.read_text())
              main_inputs = main_file('scripts/data/gpu-metal-vulkan-inputs.json')
              if main_inputs:
                  fresh = json.loads(main_inputs)
                  if 'translator' in fresh:
                      cur['translator'] = fresh['translator']
                      inputs.write_text(json.dumps(cur, indent=2, sort_keys=True) + '\n')
                      print('translator -> main', fresh['translator'].get('commit', '')[:12])
              bridge = ROOT / 'scripts/build-adreno-metal-bridge.py'
              if bridge.is_file():
                  block = lambda s: re.search(r"^PATCHES = \[.*?\]\]\n", s, re.S | re.M)
                  main_bridge = main_file('scripts/build-adreno-metal-bridge.py')
                  if main_bridge and block(main_bridge) and block(bridge.read_text()):
                      s = bridge.read_text()
                      bridge.write_text(s[:block(s).start()] + block(main_bridge).group(0) +
                                        s[block(s).end():])
                      print('PATCHES -> main')
          def checkout(path, pin):
              if path.exists():
                  return False
              path.mkdir(parents=True); run('git', 'init', '-q', path)
              run('git', '-C', path, 'fetch', '-q', '--depth=1', pin.get('mirror', pin['repository']), pin['commit'])
              run('git', '-C', path, 'checkout', '-q', '--detach', 'FETCH_HEAD')
              return True
          pins = json.loads((ROOT / 'scripts/data/adreno-compiler-inputs.json').read_text())
          mesa = ROOT / '.cache/mesa-work'
          if checkout(mesa, pins['mesa']):
              for patch in pins['patches']:
                  run('git', '-C', mesa, 'apply', ROOT / patch)
          tr = json.loads((ROOT / 'scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']
          checkout(ROOT / '.cache/gpu-reference/metal2vulkan', tr)
          venv = ROOT / '.cache/mesa-venv'
          if not (venv / 'bin/python').is_file():
              run(sys.executable, '-m', 'venv', venv)
          run(venv / 'bin/python', '-m', 'pip', 'install', '-q', '-r', ROOT / 'scripts/requirements-adreno-compiler.txt')
          print('mesa', pins['mesa']['commit'], 'patches', len(pins['patches']), 'translator', tr['commit'])
          PY

      - name: Build Turnip for ios17e
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cd out-ios17/fuxi/tree
          python3 scripts/build-turnip-darwin.py --target ios17e

      - name: Rust 1.98.0 with rust-src (the bridge builds std for arm64e)
        if: ${{ !cancelled() && inputs.build_addon }}
        run: |
          command -v rustup >/dev/null || { curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none; }
