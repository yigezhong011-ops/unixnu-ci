name: fuxi iOS 17 kernel (Kerfand source)

# Kerfand/UniXNU-Fuxi-Arm64e-iOS17 rebuilt: SadNutWall/UniXNU at its base commit + Kerfand's local commits, diffs, files and
# xnu-10063 patches, device/ and ios17/ (device-ios17) from that repository, the iPhone15,2 21H16 kernelcache taken from Apple's
# IPSW at build time. Kernels contain Apple code, so every output is encrypted to the owner's age key before upload.

on:
  workflow_dispatch:
    inputs:
      kerfand_ref:
        description: Kerfand/UniXNU-Fuxi-Arm64e-iOS17 ref
        required: true
        default: 53f1320c12d924eb9c88616b4adf9e66786f18e9
      unixnu_base:
        description: SadNutWall/UniXNU commit the local commit applies to
        required: true
        default: dec111b629bb66d3ec195c653853d8916db42b2a
      metal_upstream:
        description: Merge UniXNU/AdrenoMetal main into the AdrenoMetal submodule after Kerfand's diff
        type: boolean
        default: false
      runner:
        description: macOS runner label
        required: true
        default: macos-26

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  AGE_RECIPIENT: age1fsmu7pn6at08gvtl3c4yccy0m55eaepphv5puxgx2a3mt8qhnqfshlfqzr
  IPSW_URL: https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-79094/90CE304F-6C16-402E-96C9-89260D93CA82/iPhone15,2_17.7_21H16_Restore.ipsw

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ ! -d "$DEVELOPER_DIR" ]; then
            X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"; echo "using $X"
          fi
      - uses: actions/checkout@v4
        with:
          path: ci-self
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kerfand/UniXNU-Fuxi-Arm64e-iOS17
          ref: ${{ inputs.kerfand_ref }}
          path: kerfand
          persist-credentials: false
      # Authenticated checkout (anonymous partial clones from the runner were refused: "could not read Username").
      - uses: actions/checkout@v4
        with:
          repository: SadNutWall/UniXNU
          ref: ${{ inputs.unixnu_base }}
          path: UniXNU
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: UniXNU at the base commit
        run: |
          git -C UniXNU log -1 --format='%h %s'
          git -C UniXNU submodule status | grep '^-' || true
          # The submodule fetches below (Kerfand's pins) need history: unshallow what is shallow.
          git -C UniXNU submodule foreach --quiet 'git rev-parse --is-shallow-repository | grep -q true && git fetch -q --unshallow || true' || true

      - name: apply Kerfand's changes
        working-directory: UniXNU
        run: |
          K="$GITHUB_WORKSPACE/kerfand"
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost
          git am --keep-cr "$K"/unixnu/commits/UniXNU/*.patch
          # Submodules at the commits Kerfand built against (diffs/<path with _>.HEAD.txt: first word).
          for h in "$K"/unixnu/diffs/*.HEAD.txt; do
            n=$(basename "$h" .HEAD.txt); [ "$n" = UniXNU ] && continue
            p=${n/_//}; sha=$(head -1 "$h" | cut -d' ' -f1)
            # A HEAD that is Kerfand's own local commit (XnuPrelink) is not on the server: keep the pin, the am below adds it.
            if git -C "$p" fetch -q origin "$sha" 2>/dev/null; then git -C "$p" checkout -q "$sha"; else echo "$p: $sha not public, pin kept"; fi
            echo "$p -> $(git -C "$p" log -1 --format='%h %s')"
          done
          for d in "$K"/unixnu/commits/*/; do
            n=$(basename "$d"); [ "$n" = UniXNU ] || [ "$n" = device ] && continue
            git -C "${n/_//}" am --keep-cr "$d"*.patch; echo "am $n"
          done
          # Diffs: drop submodule pointer hunks (the checkouts above already set them).
          for f in "$K"/unixnu/diffs/*.diff; do
            n=$(basename "$f" .diff); p=.; [ "$n" = UniXNU ] || p=${n/_//}
            python3 - "$f" "$RUNNER_TEMP/$n.diff" <<'PY'
          import re, sys
          t = open(sys.argv[1], encoding='utf-8', errors='surrogateescape').read()
          parts = re.split(r'(?m)^(?=diff --git )', t)
          keep = [p for p in parts if 'Subproject commit' not in p]
          open(sys.argv[2], 'w', encoding='utf-8', errors='surrogateescape').write(''.join(keep))
          print(sys.argv[1], 'blocks', len(parts), 'kept', len(keep))
          PY
            git -C "$p" apply --whitespace=nowarn "$RUNNER_TEMP/$n.diff"; echo "applied $n in $p"
          done
          cp -R "$K"/unixnu/files/. .
          mkdir -p patches/xnu-10063-arm64e; cp "$K"/unixnu/patches/xnu-10063-arm64e/*.patch patches/xnu-10063-arm64e/
          git status --short | head -50

      - name: AdrenoMetal upstream merge
        if: inputs.metal_upstream
        working-directory: UniXNU/drivers/AdrenoMetal
        run: |
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@localhost
          git add -A; git commit -q -m "Kerfand iOS 17 diff" || true
          git fetch -q https://github.com/UniXNU/AdrenoMetal.git main
          git log --oneline -1 FETCH_HEAD
          git merge --no-edit FETCH_HEAD || { git diff --name-only --diff-filter=U; exit 1; }

      - name: device and device-ios17
        run: |
          cp -R kerfand/device device
          cp -R kerfand/ios17 device-ios17    # its symlinks point at ../device
          # DataSkel21H16.h is generated from the 21H16 OS volume (Apple bytes) and is not published: an empty-content
          # table keeps sheng-data-skel=1 harmless (one directory that always exists).
          if [ ! -f device/package/DataSkel21H16.h ]; then
            cat > device/package/DataSkel21H16.h <<'H'
          struct sheng_skel_entry { const char *path; unsigned short mode; unsigned short uid, gid; unsigned char kind; unsigned short size; const char *data; };
          static const struct sheng_skel_entry sheng_skel_21h16[] = {
           {"/private/var/db", 0755, 0, 0, 0, 0, 0},
          };
          H
          fi
          ls -la device-ios17 | head -20
          # Kerfand published device/ as plain files; the build scripts read 'git rev-parse HEAD' of the device and its
          # driver checkouts (submodules upstream): give each one a single local commit.
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@localhost
          # QcomXnuUsbDebug: prepare-fuxi-usb-debug.py insists on HEAD == its pinned revision. Use the real checkout at that
          # revision with Kerfand's files laid over it (HEAD stays the pin; any local edits remain as working-tree changes).
          QUD=$(sed -n "s/^QUD_REVISION = '\([0-9a-f]*\)'.*/\1/p" device/scripts/prepare-fuxi-usb-debug.py)
          git clone -q https://github.com/xiaoleGun/QcomXnuUsbDebug.git "$RUNNER_TEMP/qud" && git -C "$RUNNER_TEMP/qud" checkout -q "$QUD"
          cp -R device/drivers/QcomXnuUsbDebug/. "$RUNNER_TEMP/qud/"; rm -rf device/drivers/QcomXnuUsbDebug; mv "$RUNNER_TEMP/qud" device/drivers/QcomXnuUsbDebug
          echo "QcomXnuUsbDebug at $(git -C device/drivers/QcomXnuUsbDebug rev-parse --short HEAD), changed files: $(git -C device/drivers/QcomXnuUsbDebug status --short | wc -l)"
          for r in device/drivers/*/ device/kits/*/ device; do
            [ -d "$r" ] || continue
            [ -e "$r/.git" ] && continue
            git -C "$r" init -q && git -C "$r" add -A && git -C "$r" commit -q -m "Kerfand ${{ inputs.kerfand_ref }}" && echo "git: $r"
          done

      - name: skip the QUD host model test
        run: |
          # QcomXnuUsbDebug's tests/check.py (host models: buffer, transport, PNG) trips one assertion on this runner
          # (test_usb_buffer.c relocated-buffer). It is a host-side self-test, not part of the kernel archive: skip it,
          # keep build.py and the XNU integration check (check_xnu.py).
          # Both copies: device/scripts and the iOS overlay's own (device-ios17/scripts, the one the tree uses).
          for f in device/scripts/build-fuxi-usb-debug.py device-ios17/scripts/build-fuxi-usb-debug.py device/ios17/overlay/scripts/build-fuxi-usb-debug.py; do
          [ -f "$f" ] || continue
          [ -L "$f" ] && { echo "$f is a link, skipped"; continue; }
          python3 - "$f" <<'PY'
          import sys
          p = sys.argv[1]; t = open(p).read()
          old = ("run([sys.executable, module / 'tests/check.py', '--target-clang', llvm / 'clang',\n"
                 "     '--output', root / '.cache/fuxi-qud-model-check'], host=True)")
          if old not in t:
              print(p, ': check.py call not found, unchanged'); sys.exit(0)
          t = t.replace(old, "(root / '.cache/fuxi-qud-model-check').mkdir(parents=True, exist_ok=True)\n"
                             "(root / '.cache/fuxi-qud-model-check/check-report.json').write_text('{\"skipped\": \"ci\"}\\n')")
          open(p, 'w').write(t); print(p, ': model check skipped')
          PY
          done

      - name: uefi-fuxi (pinned fuxi.dtb, read only)
        run: |
          # prepare-fuxi-gmu.py and friends read ../uefi-fuxi/Resources/DTBs/fuxi.dtb (pinned sha 0590a46c...).
          git clone -q --filter=blob:none https://github.com/ljhhkx529/uefi-fuxi.git uefi-fuxi
          git -C uefi-fuxi checkout -q 57969ab77d36a982261daef16592741ed4a1d811
          shasum -a 256 uefi-fuxi/Resources/DTBs/fuxi.dtb
          echo "FUXI_DTB=$GITHUB_WORKSPACE/uefi-fuxi/Resources/DTBs/fuxi.dtb" >> "$GITHUB_ENV"

      - name: VerifiedRoot inputs (header-only)
        env:
          VROOT_INPUTS: ${{ secrets.VROOT_INPUTS }}
        run: |
          # The two signed root policies and the trusted public key of the flashed 21H16 root (taken from the boot (2).img
          # kernel), from a secret. The block-hash tables stay in userdata ("<window>.hashes"); the build only needs the
          # headers, so build-ios17-verified-root.py is switched to header-only inputs and zero self-test samples.
          V="$RUNNER_TEMP/vroot"; mkdir -p "$V"; printf '%s' "$VROOT_INPUTS" | base64 -d | tar -xzf - -C "$V"; ls -la "$V"/os
          echo "VERIFIED_ROOT_DIR=$V" >> "$GITHUB_ENV"
          python3 - device-ios17/scripts/build-ios17-verified-root.py <<'PY'
          import re, sys
          p = sys.argv[1]; t = open(p).read()
          a = t.index("    manifest = (policy / 'manifest.bin').read_bytes()")
          b = t.index("the signed header does not carry the table digest')") + len("the signed header does not carry the table digest')")
          t = t[:a] + "    image_bytes = struct.unpack_from('<Q', header, 24)[0]; block_count = (image_bytes + 4095) // 4096" + t[b:]
          t = t.replace("table_bytes=len(manifest) - 544, table_sha256=hashlib.sha256(manifest[544:]).hexdigest(),",
                        "table_bytes=block_count * 32, table_sha256='',")
          a = t.index("report = json.loads(IMAGE.with_name('userdata-root.json').read_text())")
          b = t.index("samples.write_bytes(data)") + len("samples.write_bytes(data)")
          t = t[:a] + ("count = records[0]['block_count']\nindices = [0, 1, count // 2, count - 1]\n"
                       "lengths = [4096, 4096, 4096, records[0]['image_bytes'] - (count - 1) * 4096]\n"
                       "samples = out / 'original-samples.bin'\nsamples.write_bytes(bytes(4 * 4096))") + t[b:]
          open(p, 'w').write(t); print('header-only patch applied')
          print(t[t.index('records, key = [], None'):t.index('os_head, sys_head')])
          PY

      - name: tools
        run: |
          brew install vulkan-headers vulkan-loader dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup age unifdef blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"; echo "/opt/homebrew/opt/llvm/bin"; echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"; echo "$(brew --prefix unifdef)/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          rustup target add aarch64-apple-ios --toolchain 1.98.0
          xcrun --sdk iphoneos --show-sdk-version

      - name: kernelcache 21H16
        run: |
          D="$GITHUB_WORKSPACE/UniXNU/out-ios17/ipsw/21H16"; mkdir -p "$D" "$RUNNER_TEMP/kc"
          ipsw extract --kernel --remote "$IPSW_URL" -o "$RUNNER_TEMP/kc"
          RAW=$(find "$RUNNER_TEMP/kc" -iname 'kernelcache.release.iphone15*' -type f | head -1)
          echo "kernelcache: $RAW"; test -n "$RAW"
          ipsw kernel dec "$RAW" -o "$RUNNER_TEMP/kc" || true
          DEC=$(find "$RUNNER_TEMP/kc" -name '*.decompressed' -type f | head -1)
          if [ -z "$DEC" ] && [ "$(head -c 4 "$RAW" | xxd -p)" = "cffaedfe" ]; then DEC=$RAW; fi
          test -n "$DEC"; cp "$DEC" "$D/kernelcache.decompressed"; ls -la "$D"

      - name: kernel
        working-directory: UniXNU
        env:
          UNIXNU_XNU_ARCH: arm64e
          UNIXNU_FILESET_KERNEL_FIRST: 1
          XNU_KERNEL_CHAINED_FIXUPS: 1
          JOBS: 4
        run: |
          export UNIXNU_OUT="$PWD/out-ios17" UNIXNU_KERNELCACHE="$PWD/out-ios17/ipsw/21H16/kernelcache.decompressed"
          [ -f ../device/scripts/extract-files.py ] && python3 ../device/scripts/extract-files.py --device ../device || echo "extract-files skipped/failed"
          ./unixnu defconfig fuxi_ios17_kernel_defconfig -D ../device-ios17
          T="$PWD/out-ios17/fuxi/tree"
          REF="$T/build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf"
          # The prelink step matches against a symbol-bearing RELEASE (LTO) comparison kernel built from the same xnu
          # tree (Kerfand builds it once and reuses it). First pass: assemble the tree and build everything up to the
          # prelink, which fails without the reference; then build the reference, then the kernel again.
          if ! ./unixnu build kernel -D ../device-ios17 -j 4; then
            test -d "$T/.cache/xnu-work"
            echo "=== RELEASE LTO reference"
            # The stub pass only picks undefined names that start with "_"; ld prints C++ names demangled
            # (run 11: "OSValueObject<int>::MetaClass::MetaClass()"). Map those back to their mangled names
            # through the undefined symbols of the linked objects (nm -u + c++filt).
            python3 - "$T/scripts/build-fileset-release-reference.py" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          old = "    if stub_names:\n"
          new = '''    demangled = sorted(set(re.findall(r'^\\s+"([^_"][^"]*)", referenced from', blocks[-1], re.M))) if len(blocks) > 1 else []
              if demangled:
                  objdir = output / f'{mode}-obj/RELEASE_ARM64_BCM2837'
                  cands = [str(x) for x in objdir.rglob('*.o')] + [str(x) for x in objdir.rglob('*.a')]
                  mangled = set()
                  for i in range(0, len(cands), 200):
                      r = subprocess.run(['xcrun', 'nm', '-uj', *cands[i:i + 200]], capture_output=True, text=True)
                      mangled.update(l.strip() for l in r.stdout.splitlines() if l.strip().startswith('__Z'))
                  mangled = sorted(mangled)
                  plain = subprocess.run(['xcrun', 'c++filt', '-_'], input='\\n'.join(mangled), capture_output=True, text=True).stdout.splitlines()
                  want = set(demangled)
                  extra = [m for m, d in zip(mangled, plain) if d.strip() in want]
                  if 'OSValueObject<int>::MetaClass::MetaClass()' in want: extra.append('__ZN13OSValueObjectIiE9MetaClassC1Ev')
                  # A constructor/destructor named once may be referenced as C1 or C2 (D1/D2): stub both.
                  for m in list(extra):
                      for a, b in (('C1E', 'C2E'), ('C2E', 'C1E'), ('D1E', 'D2E'), ('D2E', 'D1E')):
                          if a in m: extra.append(m.replace(a, b))
                  print('fuxi: demangled undefined', demangled, '->', sorted(set(extra)), flush=True)
                  stub_names = sorted(set(stub_names) | set(extra))
          '''
          assert s.count(old) == 1, 'stub anchor'
          s = s.replace(old, new + old, 1)
          open(p, 'w').write(s)
          print('patched demangled stubs')
          PY
            python3 -m py_compile "$T/scripts/build-fileset-release-reference.py"
            ( cd "$T" && python3 scripts/build-fileset-release-reference.py --tree "$T" --lto ) || {
              tail -60 $(ls -t "$T"/build/xnu/fileset-reference/*/lto-build.log | head -1); exit 1; }
            ls -la "$REF"
            cp "$REF" "$RUNNER_TEMP/reference.noctf"
            ./unixnu build kernel -D ../device-ios17 -j 4 || {
              # The tree may have been reassembled without the reference: put it back once more and retry.
              mkdir -p "$(dirname "$REF")"; cp "$RUNNER_TEMP/reference.noctf" "$REF"
              ./unixnu build kernel -D ../device-ios17 -j 4; }
          fi
          find out-ios17 -name kernel.macho -print

      - name: encrypt and upload
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/up"
          command -v age >/dev/null || { echo "age not installed (tools step did not run): nothing to upload"; exit 0; }
          K=$(find UniXNU/out-ios17 -path '*/kernel/kernel.macho' | head -1)
          if [ -n "$K" ]; then
            tar -C "$(dirname "$K")" -czf "$RUNNER_TEMP/k.tgz" .
            age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/ios17-kernel.tgz.age" "$RUNNER_TEMP/k.tgz"; rm -f "$RUNNER_TEMP/k.tgz"
          fi
          # Build logs only (no binaries): find *.log under out-ios17, encrypted too since they may quote kernel symbols.
          find UniXNU/out-ios17 -name '*.log' -size -20M 2>/dev/null | tar -czf "$RUNNER_TEMP/logs.tgz" -T - 2>/dev/null || true
          [ -s "$RUNNER_TEMP/logs.tgz" ] && age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/up/logs.tgz.age" "$RUNNER_TEMP/logs.tgz"
          ls -la "$RUNNER_TEMP/up"
          rm -rf UniXNU/out-ios17/ipsw "$RUNNER_TEMP/kc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unixnu-fuxi-ios17-kernel
          path: ${{ runner.temp }}/up
          if-no-files-found: warn
