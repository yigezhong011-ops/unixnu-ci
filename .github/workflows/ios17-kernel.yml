          cp "$T/ios17-addon/kernel.macho.gpuaddon" "$RUNNER_TEMP/addon-out/" || cp "$T/ios17-addon/base.gpuaddon" "$RUNNER_TEMP/addon-out/"
          cp "$T/adreno-metal-plugin17e/trust.json" "$RUNNER_TEMP/addon-out/" || true
