name: fuxi iOS 17 kernel (Kerfand source)

# Kerfand/UniXNU-Fuxi-Arm64e-iOS17 rebuilt: SadNutWall/UniXNU at its base commit + Kerfand's local commits, diffs, files and
# xnu-10063 patches, device/ and ios17/ (device-ios17) from that repository, the iPhone15,2 21H16 kernelcache taken from Apple's
# IPSW at build time. Kernels contain Apple code, so every output is encrypted to the owner's age key before upload.

on:
  workflow_dispatch:
    inputs:
      kerfand_ref:
        description: Kerfand/UniXNU-Fuxi-Arm64e-iOS17 ref
        required: true
        default: 53f1320c12d924eb9c88616b4adf9e66786f18e9
      unixnu_base:
        description: SadNutWall/UniXNU commit the local commit applies to
        required: true
        default: dec111b629bb66d3ec195c653853d8916db42b2a
      metal_upstream:
        description: AdrenoMetal at metal_ref (UniXNU/AdrenoMetal) plus .github/metal/kerfand-metal-on-main.patch
        type: boolean
        default: false
      metal_ref:
        description: UniXNU/AdrenoMetal commit for metal_upstream
        default: 73d582fd4d5772b1f5fa83581a25077a16f2b6cd
      build_kernel:
        description: Build the kernel (false = assemble the tree only, for addon-only runs)
        type: boolean
        default: true
      build_addon:
        description: Also build kernel.macho.gpuaddon (Turnip, Metal plugin, status bar, owner trust) for ios17e
        type: boolean
        default: false
      runner:
        description: macOS runner label
        required: true
        default: macos-26

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  AGE_RECIPIENT: age1fsmu7pn6at08gvtl3c4yccy0m55eaepphv5puxgx2a3mt8qhnqfshlfqzr
  IPSW_URL: https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-79094/90CE304F-6C16-402E-96C9-89260D93CA82/iPhone15,2_17.7_21H16_Restore.ipsw

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          if [ ! -d "$DEVELOPER_DIR" ]; then
            X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"; echo "using $X"
          fi
      - uses: actions/checkout@v4
        with:
          path: ci-self
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Kerfand/UniXNU-Fuxi-Arm64e-iOS17
          ref: ${{ inputs.kerfand_ref }}
          path: kerfand
          persist-credentials: false
      # Authenticated checkout (anonymous partial clones from the runner were refused: "could not read Username").
      - uses: actions/checkout@v4
        with:
          repository: SadNutWall/UniXNU
          ref: ${{ inputs.unixnu_base }}
          path: UniXNU
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false
      - name: UniXNU at the base commit
        run: |
          git -C UniXNU log -1 --format='%h %s'
          git -C UniXNU submodule status | grep '^-' || true
          # The submodule fetches below (Kerfand's pins) need history: unshallow what is shallow.
          git -C UniXNU submodule foreach --quiet 'git rev-parse --is-shallow-repository | grep -q true && git fetch -q --unshallow || true' || true

      - name: apply Kerfand's changes
        working-directory: UniXNU
        run: |
          K="$GITHUB_WORKSPACE/kerfand"
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost
          git am --keep-cr "$K"/unixnu/commits/UniXNU/*.patch
          # Submodules at the commits Kerfand built against (diffs/<path with _>.HEAD.txt: first word).
          for h in "$K"/unixnu/diffs/*.HEAD.txt; do
            n=$(basename "$h" .HEAD.txt); [ "$n" = UniXNU ] && continue
            p=${n/_//}; sha=$(head -1 "$h" | cut -d' ' -f1)
            # A HEAD that is Kerfand's own local commit (XnuPrelink) is not on the server: keep the pin, the am below adds it.
            if git -C "$p" fetch -q origin "$sha" 2>/dev/null; then git -C "$p" checkout -q "$sha"; else echo "$p: $sha not public, pin kept"; fi
            echo "$p -> $(git -C "$p" log -1 --format='%h %s')"
          done
          for d in "$K"/unixnu/commits/*/; do
            n=$(basename "$d"); [ "$n" = UniXNU ] || [ "$n" = device ] && continue
            git -C "${n/_//}" am --keep-cr "$d"*.patch; echo "am $n"
          done
          # Diffs: drop submodule pointer hunks (the checkouts above already set them).
          for f in "$K"/unixnu/diffs/*.diff; do
            n=$(basename "$f" .diff); p=.; [ "$n" = UniXNU ] || p=${n/_//}
            # 2026-11-14: GpuScanoutClient.h in drivers_AdrenoMetal.diff comes from a local-only
            # commit (5d56587); its first hunk renames a comment that 73d582fd already carries, so
            # git apply rejects the whole file. scanout_scale lives in the other three files.
            export SKIP_FILES=""
            if [ "$n" = drivers_AdrenoMetal ]; then export SKIP_FILES="GpuScanoutClient.h"; fi
            python3 - "$f" "$RUNNER_TEMP/$n.diff" <<'PY'
          import os, re, sys
          t = open(sys.argv[1], encoding='utf-8', errors='surrogateescape').read()
          parts = re.split(r'(?m)^(?=diff --git )', t)
          skip = [s for s in os.environ.get('SKIP_FILES', '').split(',') if s]
          keep = [p for p in parts if 'Subproject commit' not in p
                  and not any(p.startswith('diff --git a/' + s + ' ') for s in skip)]
          open(sys.argv[2], 'w', encoding='utf-8', errors='surrogateescape').write(''.join(keep))
          print(sys.argv[1], 'blocks', len(parts), 'kept', len(keep))
          PY
            git -C "$p" apply --whitespace=nowarn "$RUNNER_TEMP/$n.diff"; echo "applied $n in $p"
          done
          cp -R "$K"/unixnu/files/. .
          mkdir -p patches/xnu-10063-arm64e; cp "$K"/unixnu/patches/xnu-10063-arm64e/*.patch patches/xnu-10063-arm64e/
          git status --short | head -50

      - name: AdrenoMetal upstream merge
        if: inputs.metal_upstream
        working-directory: UniXNU/drivers/AdrenoMetal
        run: |
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@localhost
          git add -A; git commit -q -m "Kerfand iOS 17 diff" || true
          git fetch -q https://github.com/UniXNU/AdrenoMetal.git "${{ inputs.metal_ref }}"
          git checkout -q -f FETCH_HEAD; git log --oneline -1
          cat > "$RUNNER_TEMP/kerfand-metal-on-main.patch" <<'PATCH'
          diff --git a/NativeAdrenoMetalPlugin.mm b/NativeAdrenoMetalPlugin.mm
          index ffa797d..77f482d 100644
          --- a/NativeAdrenoMetalPlugin.mm
          +++ b/NativeAdrenoMetalPlugin.mm
          @@ -470,6 +470,9 @@ static id deviceForPort(unsigned port) {
                   setenv("CA_ALLOW_EDR_MIRRORING", "0", 1);
           #if !TARGET_OS_OSX
                   // The stored option values and the framebuffer branch are addresses of iPadOS 27's QuartzCore (24A446).
          +        // The iOS 17 arm64e build (21H16, NATIVE_ADRENO_IOS17_ARM64E) has another cache: writing those addresses
          +        // corrupted the render server, so it keeps the environment settings above only.
          +#if !defined(NATIVE_ADRENO_IOS17_ARM64E)
                   if (void *start = dlsym(RTLD_DEFAULT, "CARenderServerStart")) {
                       const uintptr_t slide = (uintptr_t)ptrauth_strip(start, ptrauth_key_function_pointer) - 0x1846dce88;
                       const float one = 1.0f, never = 1e30f;
          @@ -510,6 +513,7 @@ static id deviceForPort(unsigned port) {
                       }, gpu) == 0)
                           pthread_detach(reader);
                   }
          +#endif  // !NATIVE_ADRENO_IOS17_ARM64E
           #else
                   // macOS: the framebuffer format is changed as a fixup of signed text (the board's payload text_fixups), applied when the page
                   // passes code signing validation. A write into the mapped page from here made the page invalid, and code signing killed
          PATCH
          git apply --check "$RUNNER_TEMP/kerfand-metal-on-main.patch"
          git apply "$RUNNER_TEMP/kerfand-metal-on-main.patch"
          grep -n 'NATIVE_ADRENO_IOS17_ARM64E' NativeAdrenoMetalPlugin.mm | head -6

      - name: fixture additions (pairings the boot (2) kernel had)
        working-directory: UniXNU
        run: |
          # 14 originals the CI LTO reference left unpaired that Kerfand's boot (2) kernel pairs (same BL sites).
          # bdevsw_isfree unpaired made IOStorageFamily loop until the 64-unmapped-call panic (run 13 boot).
          cat > "$RUNNER_TEMP/fixture-adds.json" <<'JSON'
          [
           {
            "original": "0xfffffff0082da0a0",
            "original_size": 188,
            "original_sha256": "54ae08508e5387a6542c3700570c50384d0bd8c8464d7e2773fd8a29b4567627",
            "native_symbol": "_bdevsw_isfree",
            "evidence": "Paired in Kerfand boot (2) kernel: the same bundle-relative BL sites that target 0xfffffff0082da0a0 in 21H16 call _bdevsw_isfree there; the CI reference (different LTO reference build) left it to _unixnu_fileset_unmapped. IOStorageFamily looping on bdevsw_isfree returning 0 panicked at 64 unmapped calls (fuxi boot 2026-11-12 15:46)."
