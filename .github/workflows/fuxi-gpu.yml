name: fuxi GPU build

# The fuxi kernel and the Adreno GPU addon from one UniXNU revision, so the kernel GPU driver and the Metal plugin/Turnip
# share one user-client interface. The device tree is the t32 author's public repository. Kernels contain Apple code, so
# every output is encrypted to the owner's age key before upload; the private key never leaves the owner's machine.

on:
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: UniXNU/UniXNU ref
        required: true
        default: main
      device_repository:
        description: Device repository
        required: true
        default: ljhhkx529/unixnu-fuxi
      device_ref:
        description: Device repository ref
        required: true
        default: old
      defconfig:
        description: Defconfig of the device repository
        required: true
        default: fuxi_full_defconfig
      build_kernel:
        description: Build the kernel too (off builds only the GPU addon)
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  AGE_RECIPIENT: age1fsmu7pn6at08gvtl3c4yccy0m55eaepphv5puxgx2a3mt8qhnqfshlfqzr

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          path: UniXNU
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          submodules: recursive
          persist-credentials: false

      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup age unifdef blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
            echo "$(brew --prefix unifdef)/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          rustup target add aarch64-apple-ios --toolchain 1.98.0
          xcodebuild -version | head -n 1 || true
          xcrun --sdk iphoneos --show-sdk-version
          git -C UniXNU log -1 --format='UniXNU %H %cd %s'
          git -C device log -1 --format='device %H %cd %s'
          git -C UniXNU submodule status drivers/Adreno740 drivers/AdrenoMetal kits/AdrenoPM4 || true

      - name: kernel
        if: inputs.build_kernel
        working-directory: UniXNU
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
          GITHUB_TOKEN: ${{ github.token }}
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          # The PMGR and owner-root audits compare against an earlier prelinked candidate of the same original
          # kernelcache, which a first build does not have. A bootstrap pass needs it too, so take the prelinked fuxi
          # kernel of an earlier run of this repository (artifact unixnu-fuxi-kernel) and offer it as that candidate.
          mkdir -p "$RUNNER_TEMP/ref"
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=unixnu-fuxi-kernel&per_page=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["artifacts"][0]["archive_download_url"])' > "$RUNNER_TEMP/ref/url"
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -L "$(cat "$RUNNER_TEMP/ref/url")" -o "$RUNNER_TEMP/ref/k.zip"
          unzip -o -q "$RUNNER_TEMP/ref/k.zip" -d "$RUNNER_TEMP/ref"
          K=$(find "$RUNNER_TEMP/ref" -name kernel.macho | head -1); J=$(find "$RUNNER_TEMP/ref" -name kernel.json | head -1)
          echo "reference: $K $J"; test -f "$K" && test -f "$J"
          # Each kernel build reassembles out/*/tree and prunes build/, so a copy placed there does not survive. Point the
          # audit's default candidate at the reference itself instead (scripts are copied into the tree from here).
          cp "$K" "$RUNNER_TEMP/ref/candidate.macho"; cp "$J" "$RUNNER_TEMP/ref/candidate.json"
          # The tree copies scripts/ from UniXNU, then the SoC repository, then the device repository, later ones winning;
          # the device repository carries its own copy of the audit, so edit every copy in the workspace.
          # Several builders and audits read a candidate (rootauth3, mobile-graphics, v9-hid-init, ...): point every
          # build/{xnu,native}-prelink/*-candidate.macho default at the reference. UniXNU's copies use xnu-prelink,
          # the device repository's native-prelink.
          grep -rlE "build/(xnu|native)-prelink/[A-Za-z0-9-]+-candidate\.macho'" "$GITHUB_WORKSPACE/UniXNU/scripts" "$UNIXNU_DEVICE/scripts" \
            | while read -r f; do
            sed -i '' -E "s#'build/(xnu|native)-prelink/[A-Za-z0-9-]+-candidate\.macho'#'$RUNNER_TEMP/ref/candidate.macho'#g" "$f"
            echo "$f: $(grep -c "$RUNNER_TEMP/ref/candidate.macho" "$f")"
          done
          ./unixnu defconfig "$DEFCONFIG"
          python3 - <<'PY'
          import glob, json
          from pathlib import Path
          payload = {'runtime_metadata_checkpoint_sha256': '3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b'}
          for d in glob.glob('out/*/tree/build') + ['../device/build']:
              p = Path(d) / 'display-analysis'
              p.mkdir(parents=True, exist_ok=True)
              (p / 'mobile-graphics-legacy-abi.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
          # Board firmware from proprietary-files.txt (GPU GMU/SQE/ZAP ...), fetched from the device repository's public
          # mirror and checked against its SHA-256 (docs: porting/migration#build-inputs).
          python3 "$UNIXNU_DEVICE/scripts/extract-files.py" --device "$UNIXNU_DEVICE"
          # The audits also read the original iPad7 kernelcache, which the prelink step normally leaves in the device
          # repository's .cache/firmware: extract only that member from the board's IPSW (remote zip) and decompress it.
          IPSW_URL=$(python3 -c "import tomllib,sys; print(tomllib.load(open(sys.argv[1],'rb'))['ipsw']['url'])" "$UNIXNU_DEVICE/board.toml")
          KC="$UNIXNU_DEVICE/.cache/firmware/kernelcache.macho"
          mkdir -p "$KC" "$RUNNER_TEMP/kc"
          ipsw extract --kernel --remote "$IPSW_URL" -o "$RUNNER_TEMP/kc"
          RAW=$(find "$RUNNER_TEMP/kc" -iname 'kernelcache.release.ipad7*' -type f | head -1)   # ipsw names it ...iPad7,1_2_3_4
          echo "kernelcache: $RAW"
          ipsw kernel dec "$RAW" -o "$RUNNER_TEMP/kc" || true
          DEC=$(find "$RUNNER_TEMP/kc" -name '*.decompressed' -type f | head -1)
          if [ -z "$DEC" ] && [ "$(head -c 4 "$RAW" | xxd -p)" = "cffaedfe" ]; then DEC=$RAW; fi
          test -n "$DEC"
          cp "$DEC" "$KC/kernelcache.release.ipad7.decompressed"
          ls -la "$KC"
          # The legacy display builder reads build/display-analysis/mobile-graphics-legacy-abi.json, which
          # audit-mobile-graphics-legacy.py writes into the tree; its failure is swallowed without the reason. Assemble the
          # tree with a first pass, run that audit visibly, then build again.
          if ! ./unixnu build kernel; then
            T=$(ls -d out/*/tree | head -1)
            # Without the pruned QEMU runtime record the audit accepts only an existing analysis file that carries the
            # recorded runtime observation hash; seed it inside the now assembled tree, then let the audit fill in the rest.
            mkdir -p "$T/build/display-analysis"
            [ -f "$T/build/display-analysis/mobile-graphics-legacy-abi.json" ] || \
              echo '{"runtime_metadata_checkpoint_sha256": "3044c2beff552911605994c0dc7aa73182066cbb5aed0b396999ceeb5a96da2b"}' \
              > "$T/build/display-analysis/mobile-graphics-legacy-abi.json"
            echo "=== audit-mobile-graphics-legacy.py in $T"
            ( cd "$T" && python3 scripts/audit-mobile-graphics-legacy.py ) || true
            ls -la "$T/build/display-analysis" || true
            ./unixnu build kernel
          fi
          find out -path '*/kernel/kernel.macho' -newer "$RUNNER_TEMP/ref/url" -print

      - name: GPU addon
        working-directory: UniXNU
        run: |
          python3 - <<'PY'
          import importlib.util, os, subprocess, sys
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('runtime', root / 'scripts/build-boot-runtime.py')
          runtime = importlib.util.module_from_spec(spec)
          sys.argv = ['build-boot-runtime.py']
          spec.loader.exec_module(runtime)
          plugin = runtime.build_plugin('ios')
          print('plugin dir', plugin, sorted(p.name for p in plugin.iterdir()))
          out = root / 'fuxi-out'
          out.mkdir(exist_ok=True)
          subprocess.run([sys.executable, root / 'scripts/make-gpu-addon.py', '--publish', out / 'gpuaddon.bin'], check=True,
                         env=dict(os.environ, ADRENO_PLUGIN_DIR=str(plugin)))
          work = out / 'addon-x'
          work.mkdir(exist_ok=True)
          hashes = runtime.addon_hashes(out / 'gpuaddon.bin', work)
          (out / 'cdhashes.txt').write_text('\n'.join(hashes) + '\n')
          print('CDHashes', hashes)
          PY

      - name: collect and encrypt
        if: always()
        working-directory: UniXNU
        run: |
          mkdir -p fuxi-out
          for k in out/*/*/*/kernel/kernel.macho out/*/kernel/kernel.macho; do [ -f "$k" ] && cp "$k" fuxi-out/ && break; done
          cp out/*/*/*/kernel/kernel.json fuxi-out/ 2>/dev/null || true
          { git log -1 --format='UniXNU %H'; git submodule status drivers/Adreno740 drivers/AdrenoMetal kits/AdrenoPM4; } > fuxi-out/revisions.txt || true
          ls -la fuxi-out
          tar -C fuxi-out -czf - --exclude addon-x . | age -r "$AGE_RECIPIENT" -o fuxi-gpu.tar.gz.age
          rm -rf fuxi-out out/ipsw "$RUNNER_TEMP/kc" ../device/.cache/firmware/kernelcache.macho
          ls -la fuxi-gpu.tar.gz.age

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuxi-gpu-encrypted
          path: UniXNU/fuxi-gpu.tar.gz.age
          retention-days: 3
          if-no-files-found: warn

      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-gpu-logs
          path: |
            UniXNU/out/*/*/*/logs/*.log
            UniXNU/.cache/*.log
          retention-days: 3
          if-no-files-found: ignore
