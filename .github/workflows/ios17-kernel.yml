      - name: device and device-ios17
        run: |
          cp -R kerfand/device device
          cp -R kerfand/ios17 device-ios17    # its symlinks point at ../device
          # DataSkel21H16.h is generated from the 21H16 OS volume (Apple bytes) and is not published: an empty-content
          # table keeps sheng-data-skel=1 harmless (one directory that always exists).
          if [ ! -f device/package/DataSkel21H16.h ]; then
            cat > device/package/DataSkel21H16.h <<'H'
          struct sheng_skel_entry { const char *path; unsigned short mode; unsigned short uid, gid; unsigned char kind; unsigned short size; const char *data; };
          static const struct sheng_skel_entry sheng_skel_21h16[] = {
           {"/private/var/db", 0755, 0, 0, 0, 0, 0},
          };
          H
          fi
          ls -la device-ios17 | head -20
          # Kerfand published device/ as plain files; the build scripts read 'git rev-parse HEAD' of the device and its
          # driver checkouts (submodules upstream): give each one a single local commit.
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@localhost GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@localhost
          # QcomXnuUsbDebug: prepare-fuxi-usb-debug.py insists on HEAD == its pinned revision. Use the real checkout at that
          # revision with Kerfand's files laid over it (HEAD stays the pin; any local edits remain as working-tree changes).
          QUD=$(sed -n "s/^QUD_REVISION = '\([0-9a-f]*\)'.*/\1/p" device/scripts/prepare-fuxi-usb-debug.py)
          git clone -q https://github.com/xiaoleGun/QcomXnuUsbDebug.git "$RUNNER_TEMP/qud" && git -C "$RUNNER_TEMP/qud" checkout -q "$QUD"
          cp -R device/drivers/QcomXnuUsbDebug/. "$RUNNER_TEMP/qud/"; rm -rf device/drivers/QcomXnuUsbDebug; mv "$RUNNER_TEMP/qud" device/drivers/QcomXnuUsbDebug
          echo "QcomXnuUsbDebug at $(git -C device/drivers/QcomXnuUsbDebug rev-parse --short HEAD), changed files: $(git -C device/drivers/QcomXnuUsbDebug status --short | wc -l)"
          for r in device/drivers/*/ device/kits/*/ device; do
            [ -d "$r" ] || continue
            [ -e "$r/.git" ] && continue
            git -C "$r" init -q && git -C "$r" add -A && git -C "$r" commit -q -m "Kerfand ${{ inputs.kerfand_ref }}" && echo "git: $r"
          done

      - name: skip Setup (Hello) with sheng-skip-setup=1
        run: |
          # Hello is skipped through Data preferences (Kerfand seed-data-skip-setup.py, a Mac-side seed edit). Our Data starts empty,
          # so the kernel writes the same preferences at boot, beside sheng-data-skel, when sheng-skip-setup=1 (absent files only).
          cat > "$RUNNER_TEMP/skip-setup.c" <<'CSRC'
          // fuxi: sheng-skip-setup=1 writes Setup's completion preferences when they are absent, for a Data that was not made from a
          // skip-setup seed. Keys are the ones Kerfand's scripts/seed-data-skip-setup.py merges (ios-sweet sweet-root-tweaks.py).
          // Missing directories are created mobile:mobile 0755; files are mobile:mobile 0600; existing files are left alone.
          #define SKIP_PL_HEAD "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\"><dict>"
          #define SKIP_PL_TAIL "</dict></plist>\n"
          static const char *const sheng_skip_dirs[]={
           "/private/var/mobile","/private/var/mobile/Library","/private/var/mobile/Library/Preferences"};
          static const char *const sheng_skip_files[][2]={
           {"/private/var/mobile/Library/Preferences/com.apple.purplebuddy.plist",
            SKIP_PL_HEAD "<key>SetupDone</key><true/><key>SetupFinishedAllSteps</key><true/><key>SetupVersion</key><integer>11</integer>"
            "<key>daemonizeNeedsToRun</key><false/>" SKIP_PL_TAIL},
           {"/private/var/mobile/Library/Preferences/com.apple.purplebuddy.notbackedup.plist",
            SKIP_PL_HEAD "<key>ShouldRunDiagnosticsMiniBuddy</key><false/><key>ShouldRunHSA2MiniBuddy</key><false/>"
            "<key>ShouldRunKeychainSyncMiniBuddy</key><false/><key>ShouldRunMesaMiniBuddy</key><false/><key>ShouldRunPaymentMiniBuddy</key><false/>"
            "<key>ShouldRunStandardMiniBuddy</key><false/><key>SilentICDPUpgrade</key><false/>" SKIP_PL_TAIL},
           {"/private/var/mobile/Library/Preferences/com.apple.springboard.plist",
            SKIP_PL_HEAD "<key>BKNoWatchdogs</key><true/><key>FBLaunchWatchdogExceptions</key><dict><key>com.apple.purplebuddy</key><real>100</real></dict>"
            "<key>MCForceShowCloudConfigurationUI</key><false/>" SKIP_PL_TAIL},
           {"/private/var/mobile/Library/Preferences/com.apple.managedconfiguration.notbackedup.plist",
            SKIP_PL_HEAD "<key>LockdownActivationIndicatesCloudConfigurationAvailable</key><false/>" SKIP_PL_TAIL},
           {"/private/var/mobile/Library/Preferences/com.apple.migration.plist",
            SKIP_PL_HEAD "<key>LastSystemVersion</key><string>21H16</string><key>DMUserDataDisposition</key><dict>"
            "<key>SyntheticDidUpgrade</key><false/><key>buildVersion</key><string>21H16</string></dict>" SKIP_PL_TAIL}};

          static int sheng_boot_skip_setup(proc_t p,uint64_t scratch) {
           int on=0;int32_t result=0;
           // 1 = write absent files only; 2 = rewrite all five on every boot (a persistent Data where Setup already created them).
           if(!PE_parse_boot_argn("sheng-skip-setup",&on,sizeof(on)) || (on!=1 && on!=2))return 0;
