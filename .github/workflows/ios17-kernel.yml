      # 第 8 项：编 dylib + 给插件加 @loader_path/FuxiStatusBar.dylib + 重签 + 塞进 addon。
      # 脚本里有四组作者硬编码路径，必须先 sed。BASE 指到**含 UniXNU/ 的那一层**（$GITHUB_WORKSPACE），
      # 因为脚本里 TREE = BASE/'UniXNU/out-ios17/fuxi/tree'。
      - name: Patch the status bar script's hardcoded paths
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          python3 - "$GITHUB_WORKSPACE" "$SDK" <<'PY'
          import sys
          from pathlib import Path
          base, sdk = sys.argv[1], sys.argv[2]
          p = Path('out-ios17/fuxi/tree/scripts/build-fuxi-statusbar.py')
          s = p.read_text()
          s = s.replace("'/home/xiaomi/sadnut-fuxi-local-20261103'", repr(base))
          s = s.replace("'/home/xiaomi/sdk/iPhoneOS17-21H16.sdk'", repr(sdk))
          s = s.replace(
              "env['PATH'] = ':'.join(['/home/xiaomi/.local/bin', str(BASE / 'bin'), '/home/xiaomi/unixnu-linux/CommandLineTools/usr/bin', env['PATH']])",
              "env['PATH'] = env['PATH']")
          p.write_text(s)
          print('patched BASE ->', base, 'SDK ->', sdk)
          PY
          grep -nE "^BASE|^TREE|^SRC|^OUT|^BUNDLE|^SDK" out-ios17/fuxi/tree/scripts/build-fuxi-statusbar.py

      - name: Pack the base GPU addon
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cd out-ios17/fuxi/tree
