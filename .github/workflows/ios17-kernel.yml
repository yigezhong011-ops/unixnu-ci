          cat > "$RUNNER_TEMP/qud-reply-room.py" <<'REPLYPY'
          #!/usr/bin/env python3
          """QcomXnuUsbDebug.c: control replies were dropped on the iOS 17 run (no SXNU1R at all, contention climbing). The reply
          queue drained the log backlog into the transmitter first and then needed room for the whole reply, so a busy log stream
          always won. Queue the reply first, then drain the backlog, and wait up to 50 ms (thread context) for room before giving up.
          Usage: qud-reply-room.py <QcomXnuUsbDebug.c>"""
          import sys
          p = sys.argv[1]
          s = open(p).read()
          def sub(old, new):
              global s
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          sub('static size_t control_reply_queue(const char *reply, size_t bytes)\n{\n',
              'static size_t control_reply_queue_once(const char *reply, size_t bytes)\n{\n')
          sub('    if (native.status.phase == QCOM_USB_DEBUG_ACTIVE) {\n'
              '        backlog_drain_owned();\n'
              '        if (DWC3_TX_BYTES - dwc3_queued(native.core) >= bytes + 1u) {\n'
              '            wire[0] = (uint8_t)\'\\n\';\n'
              '            bytes_copy(wire + 1u, reply, bytes);\n'
              '            if (dwc3_queue(native.core, wire, bytes + 1u) == bytes + 1u) queued = 1;\n'
              '        }\n'
              '    }\n',
              '    if (native.status.phase == QCOM_USB_DEBUG_ACTIVE) {\n'
              '        if (DWC3_TX_BYTES - dwc3_queued(native.core) >= bytes + 1u) {\n'
              '            wire[0] = (uint8_t)\'\\n\';\n'
              '            bytes_copy(wire + 1u, reply, bytes);\n'
              '            if (dwc3_queue(native.core, wire, bytes + 1u) == bytes + 1u) queued = 1;\n'
              '        }\n'
              '        backlog_drain_owned();\n'
              '    }\n')
          sub('    if (queued) (void)__atomic_add_fetch(&control_reply_count, 1u, __ATOMIC_RELAXED);\n'
              '    return queued ? bytes : 0;\n'
              '}\n',
              '    if (queued) (void)__atomic_add_fetch(&control_reply_count, 1u, __ATOMIC_RELAXED);\n'
              '    return queued ? bytes : 0;\n'
              '}\n'
              'static size_t control_reply_queue(const char *reply, size_t bytes)\n'
              '{\n'
              '    for (unsigned int n = 0; n < 500u; ++n) {\n'
              '        size_t q = control_reply_queue_once(reply, bytes);\n'
              '        if (q || native.status.phase != QCOM_USB_DEBUG_ACTIVE) return q;\n'
              '        delay_us(0, 100);\n'
              '    }\n'
              '    return 0;\n'
              '}\n')
          open(p, 'w').write(s)
          print('reply room patch applied', p)
          REPLYPY
          cat > "$RUNNER_TEMP/qud-control-fix.py" <<'CTLPY'
          #!/usr/bin/env python3
          """QcomUsbControl.h after usb-touch-inject.patch: TAP/SWP sit after REBOOT-FASTBOOT in the verb enum, but accept/commit
          only allow verbs up to REBOOT-FASTBOOT, so every TAP/SWP was refused. Also keep the parser free of side effects on a
          rejected frame (the module's exact-length test): collect the arguments locally, store them with the other fields.
          Usage: qud-control-fix.py <QcomUsbControl.h>"""
          import sys
          p = sys.argv[1]
          s = open(p).read()
          def sub(old, new, count=1):
              global s
              assert s.count(old) == count, (old, s.count(old))
              s = s.replace(old, new)
          sub('        frame->verb > SXNU_CONTROL_VERB_REBOOT_FASTBOOT) return SXNU_CONTROL_VERB_INVALID;\n',
              '        frame->verb > SXNU_CONTROL_VERB_SWIPE) return SXNU_CONTROL_VERB_INVALID;\n')
          sub('        accepted > SXNU_CONTROL_VERB_REBOOT_FASTBOOT || frame->verb != accepted) return 0;\n',
              '        accepted > SXNU_CONTROL_VERB_SWIPE || frame->verb != accepted) return 0;\n')
          sub('    /* Optional decimal arguments between the verb and the CRC.',
              '    uint32_t parsed_args[SXNU_CONTROL_ARGS] = {0, 0, 0, 0, 0};\n'
              '    uint8_t parsed_nargs = 0;\n'
              '    /* Optional decimal arguments between the verb and the CRC.')
          sub('            frame->arg[got++] = (uint32_t)value;\n', '            parsed_args[got++] = (uint32_t)value;\n')
          sub('        frame->nargs = (uint8_t)got;\n', '        parsed_nargs = (uint8_t)got;\n')
          sub('    frame->verb = verb;\n',
              '    frame->verb = verb;\n'
              '    for (unsigned i = 0; i < SXNU_CONTROL_ARGS; ++i) frame->arg[i] = parsed_args[i];\n'
              '    frame->nargs = parsed_nargs;\n')
          open(p, 'w').write(s)
          print('control fix applied', p)
          CTLPY
          for d in $(find device device-ios17 -path "*QcomXnuUsbDebug/kernel/QcomXnuUsbDebug.c" -type f | sed "s#/kernel/QcomXnuUsbDebug.c##"); do
            python3 "$RUNNER_TEMP/qud-shot-direct.py" "$d/kernel/QcomUsbScreenshot.c"
            python3 "$RUNNER_TEMP/qud-reply-room.py" "$d/kernel/QcomXnuUsbDebug.c"
            # Run 17/18 answered nothing: the TAP/SWP parser wanted a second space before the CRC of every frame without
            # arguments, and accept/commit refused TAP/SWP. qud-control-fix.py fixes the range and the side effects.
            python3 "$RUNNER_TEMP/qud-control-fix.py" "$d/kernel/QcomUsbControl.h"; n=$((n+1)); done
