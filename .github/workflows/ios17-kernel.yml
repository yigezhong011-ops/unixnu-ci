      - name: FuxiStatusBar into the addon (trust.json gets the CDHashes)
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
        run: |
          cd out-ios17/fuxi/tree
          python3 scripts/build-fuxi-statusbar.py build/ios17-addon/base.gpuaddon build/ios17-addon/kernel.macho.gpuaddon
          ls -l build/ios17-addon; cat build/adreno-metal-plugin17e/trust.json

      - name: Collect the iOS GPU addon
        if: ${{ !cancelled() && inputs.build_addon }}
        working-directory: UniXNU
